<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Pixel Boss Hunt ULTRA</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05070c;color:#eaf0ff;font-family:system-ui,Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;background:#05070c}
.hud{position:fixed;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;z-index:2}
.row{display:flex;gap:6px;flex-wrap:wrap}
.p{background:rgba(9,13,22,.92);border:1px solid rgba(70,98,140,.85);border-radius:999px;padding:5px 9px;font-size:12px;white-space:nowrap}
.boss{position:fixed;top:52px;left:50%;transform:translateX(-50%);width:min(760px,80vw);display:none;z-index:2;pointer-events:none}
.boss .t{text-align:center;font-size:12px;color:#ffd4d4;margin-bottom:4px}
.boss .s{height:12px;background:rgba(0,0,0,.5);border:1px solid rgba(255,106,106,.8);border-radius:999px;overflow:hidden}
.boss .f{height:100%;width:100%;background:linear-gradient(90deg,#ff5252,#ffb16b)}
.msg{position:fixed;top:82px;left:50%;transform:translateX(-50%);background:rgba(10,16,28,.95);border:1px solid rgba(80,120,180,.9);border-radius:12px;padding:8px 12px;font-size:13px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:4}
.msg.show{opacity:1}
.bot{position:fixed;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;gap:10px;z-index:2}
.note{max-width:78vw;background:rgba(9,13,22,.92);border:1px solid rgba(70,98,140,.85);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.35;color:#c7d8f0}
.ctrls{display:flex;gap:8px}
button{background:#16223a;color:#eaf0ff;border:1px solid #33517d;border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer}

:root{
  --m-gap:8px;
  --m-pad:8px;
  --btn:54px;
  --move-font:20px;
  --fire:92px;
  --jump:78px;
  --small-h:38px;
  --small-f:12px;
  --t-radius:14px;
}

*{box-sizing:border-box}
button,canvas,body{-webkit-tap-highlight-color:transparent}
.touch{position:fixed;inset:0;display:none;pointer-events:none;z-index:6;touch-action:none}
.touch .cluster{position:absolute;display:flex;gap:var(--m-gap);pointer-events:none}
.touch .cluster.left{left:var(--m-pad);bottom:max(var(--m-pad),env(safe-area-inset-bottom));align-items:flex-end}
.touch .cluster.right{right:var(--m-pad);bottom:max(var(--m-pad),env(safe-area-inset-bottom));align-items:flex-end}
.touch .stack{display:flex;flex-direction:column;gap:calc(var(--m-gap) - 2px);pointer-events:none}
.tbtn{pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;background:rgba(15,22,36,.72);color:#f4f8ff;border:1px solid rgba(106,150,225,.68);border-radius:var(--t-radius);min-width:var(--btn);height:var(--btn);padding:0 8px;font-weight:800;font-size:12px;backdrop-filter:blur(3px);box-shadow:0 0 0 1px rgba(255,255,255,.03) inset}
.tbtn.on{transform:translateY(1px) scale(.98);background:rgba(35,55,95,.9);border-color:#7fc8ff;box-shadow:0 0 14px rgba(90,190,255,.2)}
.tbtn.big{width:var(--fire);height:var(--fire);border-radius:999px;font-size:15px}
.tbtn.jump{min-width:var(--jump);height:var(--jump);border-radius:14px;font-size:14px}
.tbtn.move{width:var(--btn);height:var(--btn);border-radius:var(--t-radius);font-size:var(--move-font)}
.tbtn.small{min-width:var(--btn);height:var(--small-h);border-radius:9px;font-size:var(--small-f);font-weight:700}
.touch .topbar{position:absolute;top:max(4px,env(safe-area-inset-top));right:6px;display:flex;gap:4px;pointer-events:none}
@media (max-width:900px), (pointer:coarse){
  html,body{touch-action:none;overscroll-behavior:none}
  .hud{top:max(4px,env(safe-area-inset-top));left:4px;right:4px;gap:4px;flex-direction:column;align-items:flex-start}
  .hud .row{gap:3px}
  .hud .row:nth-child(2){display:none}
  .p{font-size:10px;padding:3px 6px}
  .boss{top:38px;width:min(96vw,760px)}
  .msg{top:62px;max-width:94vw;text-align:center;font-size:12px}
  .bot{display:none}
  .touch{display:block}
}
@media (max-width:420px){
  :root{ --m-gap:5px; --m-pad:6px; --t-radius:10px; }
  .tbtn{font-size:11px}
  .tbtn.big{font-size:13px}
  .tbtn.jump{font-size:12px}
}
@media (pointer:coarse) and (orientation:portrait){
  .touch .cluster.left{left:max(6px,var(--m-pad));bottom:max(var(--m-pad),env(safe-area-inset-bottom))}
  .touch .cluster.right{right:max(6px,var(--m-pad));bottom:max(var(--m-pad),env(safe-area-inset-bottom))}
  .touch .topbar{left:max(6px,var(--m-pad));right:auto}
}

</style>
</head>
<body>
<canvas id="g"></canvas>
<div class="hud">
  <div class="row">
    <div class="p" id="hp"></div><div class="p" id="wpn"></div><div class="p" id="wave"></div><div class="p" id="score"></div>
    <div class="p" id="combo"></div><div class="p" id="armor"></div>
  </div>
  <div class="row">
    <div class="p" id="dash"></div><div class="p" id="nade"></div><div class="p" id="shock"></div><div class="p" id="boost"></div>
    <div class="p" id="sup"></div><div class="p" id="snd"></div>
  </div>
</div>
<div class="boss" id="boss"><div class="t" id="bossTxt"></div><div class="s"><div class="f" id="bossFill"></div></div></div>
<div class="msg" id="msg"></div>
<div class="bot">
  <div class="note"><b>Move</b> A/D • <b>Jump</b> W/Space • <b>Shoot</b> Mouse/F • <b>Dash</b> Shift • <b>Grenade</b> G • <b>Shock</b> Q • <b>Boost</b> C • <b>Pause</b> P<br><b>Flare system:</b> picking a flare <i>replaces your weapon</i> until you throw it. Then your old weapon returns automatically. Flare payloads call different support.</div>
  <div class="ctrls"><button id="rst">Restart</button><button id="pause">Pause</button></div>
</div>

<div class="touch" id="touchUI" aria-hidden="true">
  <div class="topbar">
    <button class="tbtn small" id="tbPauseM">Pause</button>
    <button class="tbtn small" id="tbRestartM">Restart</button>
    <button class="tbtn small" id="tbSoundM">Sound</button>
  </div>
  <div class="cluster left">
    <button class="tbtn move" id="tbLeft">◀</button>
    <button class="tbtn move" id="tbRight">▶</button>
  </div>
  <div class="cluster right">
    <button class="tbtn jump" id="tbJump">JUMP</button>
    <button class="tbtn big" id="tbShoot">FIRE</button>
  </div>
</div>

<script>
(()=>{
'use strict';
// ===== setup =====
const W=1600,H=900,GRAV=1850,PLAYER_GRAV=1720,BOSS_EVERY=4;
const c=document.getElementById('g'), x=c.getContext('2d'); x.imageSmoothingEnabled=false;
let dpr=1, sw=0, sh=0, s=1, ox=0, oy=0;
const cam={x:0,y:0,vw:W,vh:H,portrait:false,mobile:false};
function isTouchMobile(){ return (matchMedia('(pointer:coarse)').matches||('ontouchstart' in window)); }
function isPortraitMobile(){ return isTouchMobile() && innerHeight>innerWidth*1.05; }
function updateMobileUILayout(){
  if(!cam.mobile) return;
  const short=Math.max(280,Math.min(sw,sh));
  const portrait=sh>sw*1.02;
  const base=clamp(Math.round(short*(portrait?0.13:0.10)),46,68);
  const fire=clamp(Math.round(short*(portrait?0.22:0.165)),80,112);
  const jump=clamp(Math.round(short*(portrait?0.19:0.145)),66,96);
  const smallH=clamp(Math.round(base*0.84),34,46);
  const gap=clamp(Math.round(base*0.16),5,12);
  const pad=clamp(Math.round(base*0.16),6,14);
  const root=document.documentElement.style;
  root.setProperty('--btn',base+'px');
  root.setProperty('--fire',fire+'px');
  root.setProperty('--jump',jump+'px');
  root.setProperty('--small-h',smallH+'px');
  root.setProperty('--m-gap',gap+'px');
  root.setProperty('--m-pad',pad+'px');
  root.setProperty('--small-f',(portrait?12:11)+'px');
  root.setProperty('--move-font',(base>=58?22:(base>=50?20:18))+'px');
  root.setProperty('--t-radius',(base>=58?16:(base>=50?14:12))+'px');
}
function resize(){
  dpr=Math.max(1,Math.min(2,devicePixelRatio||1));
  sw=innerWidth; sh=innerHeight;
  c.width=sw*dpr; c.height=sh*dpr;
  cam.mobile=isTouchMobile();
  cam.portrait=cam.mobile && (sh>sw*1.02);
  if(cam.mobile){
    // Mobile now always uses a zoomed follow camera so the player + local action look big.
    // We render only a smaller viewport of the map and move it with the player.
    // Stronger zoom for mobile: show only the local area around the player.
    // Portrait gets the biggest zoom so the player and enemies look much larger.
    const targetVh = cam.portrait ? clamp(H*0.38, 320, 400) : clamp(H*0.50, 380, 520);
    cam.vh=targetVh;
    cam.vw=clamp(targetVh*(sw/sh), cam.portrait?180:560, cam.portrait?340:860);
  }else{
    cam.vw=W; cam.vh=H;
    cam.x=0; cam.y=0;
  }
  cam.vw=Math.min(cam.vw,W); cam.vh=Math.min(cam.vh,H);
  cam.x=clamp(cam.x,0,Math.max(0,W-cam.vw));
  cam.y=clamp(cam.y,0,Math.max(0,H-cam.vh));
  s=Math.min(sw/cam.vw,sh/cam.vh);
  ox=(sw-cam.vw*s)/2;
  oy=(sh-cam.vh*s)/2;
  if(cam.mobile) updateMobileUILayout();
}
function screenToWorld(sx,sy){
  return {
    x: clamp(cam.x + (sx-ox)/s, 0, W),
    y: clamp(cam.y + (sy-oy)/s, 0, H)
  };
}
function updateCamera(dt=0){
  if(!cam.mobile){ cam.x=0; cam.y=0; return; }

  const px=P?P.x+P.w*.5:W*.5;
  const py=P?P.y+P.h*.5:H*.5;

  // Horizontal follow is the priority on mobile (faster + with look-ahead)
  const lookX=clamp((P&&P.vx?P.vx*0.20:0)+(touchCtl&&touchCtl.shoot?cam.vw*0.08:0),-160,180);
  const targetX=clamp(px+lookX-cam.vw*.5,0,Math.max(0,W-cam.vw));

  // Vertical follow is slower and uses a soft dead-zone (less motion sickness)
  // The camera only moves vertically when the player leaves this comfort band.
  const topBand = cam.y + cam.vh*0.30;
  const botBand = cam.y + cam.vh*0.72;
  let targetY = cam.y;
  if(py < topBand){
    targetY = py - cam.vh*0.34;
  }else if(py > botBand){
    targetY = py - cam.vh*0.70;
  }
  // Tiny vertical look-ahead when falling/jumping, but very limited.
  targetY += clamp((P&&P.vy?P.vy*0.03:0), -18, 26);
  targetY = clamp(targetY,0,Math.max(0,H-cam.vh));

  const base=Math.min(1,dt*4+0.10);
  const smoothX=1-Math.pow(0.0001,base);
  const smoothY=1-Math.pow(0.05,base*0.42); // much slower than X by design

  cam.x += (targetX-cam.x)*smoothX;
  cam.y += (targetY-cam.y)*smoothY;
}
addEventListener('resize',resize);
const UI={ hp:hp,wpn:wpn,wave:wave,score:score,combo:combo,armor:armor,dash:dash,nade:nade,shock:shock,boost:boost,sup:sup,snd:snd,boss:boss,bossTxt:bossTxt,bossFill:bossFill };
const pauseBtn=document.getElementById('pause'), rstBtn=document.getElementById('rst'), msgEl=document.getElementById('msg');
function msg(t,ms=900){ msgEl.textContent=t; msgEl.classList.add('show'); clearTimeout(msg._t); msg._t=setTimeout(()=>msgEl.classList.remove('show'),ms); }

// ===== math helpers =====
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rand(a,b+1));
const sign=v=>v<0?-1:v>0?1:0;
const d2=(ax,ay,bx,by)=>(ax-bx)*(ax-bx)+(ay-by)*(ay-by);
const len=(x,y)=>Math.hypot(x,y)||1;
const norm=(x,y)=>{const l=len(x,y);return [x/l,y/l];};
function rr(a,b){ return a.x<a.x+a.w && a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function ov(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function ptRect(px,py,r){ return px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h; }

// ===== audio =====
let ac=null,soundOn=true;
function au(){ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }
function beep(f=500,d=.04,v=.012,t='square',slide=0,noise=false){ if(!soundOn||!ac) return; const T=ac.currentTime; const g=ac.createGain(); g.gain.setValueAtTime(.0001,T); g.gain.exponentialRampToValueAtTime(v,T+.005); g.gain.exponentialRampToValueAtTime(.0001,T+d); g.connect(ac.destination); if(noise){ const n=Math.floor(ac.sampleRate*d), b=ac.createBuffer(1,n,ac.sampleRate), q=b.getChannelData(0); for(let i=0;i<n;i++) q[i]=(Math.random()*2-1)*(1-i/n); const src=ac.createBufferSource(); const fil=ac.createBiquadFilter(); fil.type='bandpass'; fil.frequency.value=f; src.buffer=b; src.connect(fil); fil.connect(g); src.start(T); src.stop(T+d); return; } const o=ac.createOscillator(); o.type=t; o.frequency.setValueAtTime(f,T); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(50,f+slide),T+d); o.connect(g); o.start(T); o.stop(T+d); }
const S={
  shot:n=>({pistol:[700,.02],revolver:[520,.03],smg:[900,.012],lmg:[760,.014],burst:[780,.016],shotgun:[1400,.04],drum:[1180,.032],rifle:[560,.022],sniper:[300,.07],rail:[380,.09],gauss:[320,.055],rpg:[135,.09],micro:[180,.045],minigun:[760,.012],plasma:[1050,.016],tesla:[980,.02],flame:[220,.02],laser:[640,.02],cross:[520,.025],rico:[780,.018],mortar:[190,.065],launcher:[210,.06],needler:[1180,.014],shred:[1280,.03],disc:[260,.05],ion:[420,.05],chaingun:[640,.012],seeker:[165,.04],arcaster:[820,.018],flare:[480,.06]})[n]||[700,.02],
  fire(n){const a=this.shot(n); if(n==='shotgun'||n==='drum'||n==='shred') {beep(180,.05,.012,'sawtooth',-20); beep(1700,.045,.012,'square',-200,true);} else if(n==='rail'||n==='gauss'||n==='ion') {beep(300,.08,.012,'triangle',260); beep(1200,.03,.008,'square',0,true);} else if(n==='tesla'||n==='arcaster'){beep(n==='arcaster'?700:760,.03,.009,'sawtooth',90); beep(1400,.018,.004,'square',0,true);} else if(n==='revolver'){beep(420,.03,.012,'square',-70); beep(1800,.02,.005,'square',0,true);} else if(n==='rpg'){beep(135,.085,.016,'sawtooth',-40); beep(72,.16,.01,'triangle',-14); beep(980,.03,.006,'square',0,true);} else if(n==='micro'){beep(170,.04,.01,'sawtooth',-25); if(Math.random()<.5) beep(760,.012,.004,'square',0,true);} else if(n==='minigun'||n==='chaingun'){beep(n==='chaingun'?460:520,n==='chaingun'?.016:.014,.01,'square',-28); if(Math.random()<.45) beep(240,.026,.004,'triangle',0,true); if(Math.random()<.22) beep(1040,.008,.003,'square',0,true);} else if(n==='flame'){beep(185,.03,.01,'sawtooth',-45,true); if(Math.random()<.45) beep(95,.035,.005,'triangle',-8,true); if(Math.random()<.22) beep(1250,.01,.003,'square',0,true);} else if(n==='mortar'||n==='launcher'){beep(170,.06,.012,'triangle',-20); beep(900,.022,.005,'square',0,true);} else if(n==='seeker'){beep(165,.05,.012,'sawtooth',-22); if(Math.random()<.55) beep(720,.012,.004,'square',0,true);} else if(n==='needler'){beep(1180,.014,.006,'square',60); beep(720,.008,.003,'triangle',0,true);} else if(n==='laser'){beep(700,.018,.008,'triangle',-70); beep(1300,.01,.003,'square',0);} else beep(a[0],a[1],.01,(n==='plasma'||n==='tesla')?'sawtooth':'square',-80);},
  boom(){ beep(140,.13,.02,'sawtooth',-25,true); beep(95,.09,.01,'triangle',-10); },
  hit(){ beep(260,.014,.006,'square',-50); }, hurt(){ beep(130,.05,.015,'square',0); }, pick(){ beep(700,.04,.009,'triangle',140); setTimeout(()=>beep(980,.05,.009,'triangle',80),16); },
  dash(){ beep(2200,.03,.01,'square',0,true); }, jump(){ beep(430,.03,.009,'triangle',60); }, boss(){ beep(120,.16,.015,'sawtooth',-15); }, wave(){ beep(520,.07,.01,'triangle',120); }
};

// ===== input =====
const keys=new Set(); let mDown=false; const mouse={sx:0,sy:0,wx:800,wy:450,active:false};
const touchCtl={enabled:matchMedia('(pointer:coarse)').matches||('ontouchstart' in window),left:false,right:false,jump:false,shoot:false,dash:false,gren:false,shock:false,boost:false};
function releaseTouch(){ touchCtl.left=touchCtl.right=touchCtl.jump=touchCtl.shoot=touchCtl.dash=touchCtl.gren=touchCtl.shock=touchCtl.boost=false; document.querySelectorAll('.tbtn.on').forEach(b=>b.classList.remove('on')); }
function clearIn(){ keys.clear(); mDown=false; releaseTouch(); }
addEventListener('keydown',e=>{ const block=['KeyA','KeyD','KeyW','KeyS','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','ShiftLeft','ShiftRight','KeyF','KeyG','KeyQ','KeyC','KeyP','KeyM']; if(block.includes(e.code)) e.preventDefault(); au(); if(e.code==='KeyP'){togglePause();return;} if(e.code==='KeyM'){soundOn=!soundOn;return;} keys.add(e.code); },{passive:false});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',clearIn); document.addEventListener('visibilitychange',()=>document.hidden&&clearIn());
addEventListener('pointerup',e=>{ if(e.pointerType==='touch'&&e.target===c) mDown=false; },{passive:false});
c.addEventListener('mousemove',e=>{ mouse.sx=e.clientX; mouse.sy=e.clientY; mouse.active=true; const pt=screenToWorld(mouse.sx,mouse.sy); mouse.wx=pt.x; mouse.wy=pt.y; });
c.addEventListener('mousedown',e=>{ if(e.button===0){au();mDown=true;} }); addEventListener('mouseup',e=>{ if(e.button===0)mDown=false; }); c.addEventListener('contextmenu',e=>e.preventDefault());
function bindTouchHold(id,key){
  const el=document.getElementById(id); if(!el) return;
  const on=e=>{ if(!touchCtl.enabled) return; e.preventDefault(); au(); touchCtl[key]=true; el.classList.add('on'); try{ el.setPointerCapture(e.pointerId); }catch(_){ } };
  const off=e=>{ if(!touchCtl.enabled) return; e.preventDefault(); touchCtl[key]=false; el.classList.remove('on'); };
  el.addEventListener('pointerdown',on,{passive:false});
  el.addEventListener('pointerup',off,{passive:false});
  el.addEventListener('pointercancel',off,{passive:false});
  el.addEventListener('lostpointercapture',off,{passive:false});
}
function bindTouchTap(id,fn){
  const el=document.getElementById(id); if(!el) return;
  el.addEventListener('pointerdown',e=>{ if(!touchCtl.enabled) return; e.preventDefault(); au(); el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),120); fn(); },{passive:false});
}
if(touchCtl.enabled){
  document.body.classList.add('mobile-ui');
  bindTouchHold('tbLeft','left'); bindTouchHold('tbRight','right'); bindTouchHold('tbJump','jump'); bindTouchHold('tbShoot','shoot');
  bindTouchHold('tbDash','dash'); bindTouchHold('tbGren','gren'); bindTouchHold('tbShock','shock'); bindTouchHold('tbBoost','boost');
  bindTouchTap('tbPauseM',()=>togglePause());
  bindTouchTap('tbRestartM',()=>reset());
  bindTouchTap('tbSoundM',()=>{ soundOn=!soundOn; });
  c.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='touch') return;
    if(e.target!==c) return;
    e.preventDefault(); au();
    const sx=e.clientX, sy=e.clientY;
    mouse.sx=sx; mouse.sy=sy; mouse.active=true;
    const pt=screenToWorld(sx,sy); mouse.wx=pt.x; mouse.wy=pt.y;
  },{passive:false});
  c.addEventListener('pointermove',e=>{
    if(e.pointerType!=='touch') return;
    const sx=e.clientX, sy=e.clientY;
    mouse.sx=sx; mouse.sy=sy; mouse.active=true;
    const pt=screenToWorld(sx,sy); mouse.wx=pt.x; mouse.wy=pt.y;
  },{passive:false});
}

// ===== world =====
const solids=[
  {x:0,y:842,w:1600,h:58,k:'g'}, {x:35,y:210,w:24,h:632,k:'w'}, {x:1541,y:210,w:24,h:632,k:'w'},
  {x:760,y:600,w:80,h:242,k:'m'}, {x:720,y:510,w:160,h:18,k:'m'},
  {x:350,y:765,w:90,h:77,k:'c'}, {x:500,y:748,w:84,h:94,k:'c'}, {x:590,y:690,w:70,h:152,k:'c'},
  {x:1160,y:748,w:84,h:94,k:'c'}, {x:1040,y:690,w:70,h:152,k:'c'}, {x:1260,y:765,w:90,h:77,k:'c'},
  {x:250,y:610,w:54,h:232,k:'m'}, {x:1296,y:610,w:54,h:232,k:'m'},
  {x:430,y:805,w:58,h:37,k:'m'}, {x:1112,y:805,w:58,h:37,k:'m'},
  {x:690,y:780,w:56,h:62,k:'m'}, {x:854,y:780,w:56,h:62,k:'m'}

function safeWpnKey(k){ return (k && WPN[k]) ? k : 'smg'; }
function weaponAmmoRoll(k){ const cfg=WPN[safeWpnKey(k)]; if(!cfg||!Array.isArray(cfg.ammo)) return 1; return rint(cfg.ammo[0],cfg.ammo[1]); }
function weaponDropAmmo(k,cur){ const cfg=WPN[safeWpnKey(k)]; if(!cfg||!Array.isArray(cfg.ammo)) return 1; const lo=cfg.ammo[0], hi=cfg.ammo[1]; const minKeep=Math.max(2,Math.ceil(lo*.24)); return clamp(Math.floor(cur*.72),minKeep,Math.ceil(hi*.96)); }
function isRareWeapon(k){ return ['rpg','micro','seeker','minigun','chaingun','rail','gauss','ion','tesla','arcaster'].includes(k); }

function pickLootWeapon(){
  const pool=['smg','revolver','lmg','burst','shotgun','drum','rifle','plasma','laser','rico','shred','needler','smg','shotgun','flame','flame'];
  if(waveN>=2) pool.push('cross','flame','tesla','launcher','needler','micro','rpg','arcaster');
  if(waveN>=3) pool.push('sniper','gauss','disc','mortar','rpg','rpg','flame','micro','minigun','minigun','seeker');
  if(waveN>=4) pool.push('rail','ion','rpg','minigun','minigun','launcher','micro','flame','chaingun','arcaster');
  if(waveN>=5) pool.push('rail','gauss','tesla','ion','disc','minigun','rpg','micro','seeker','flame','chaingun');
  if(waveN>=7) pool.push('rail','gauss','tesla','ion','rpg','minigun','micro','needler','minigun','chaingun','seeker','arcaster');

  let forced='';
  if(waveN>=1 && lootPity.flame>=2) forced='flame';
  if(waveN>=2 && lootPity.rpg>=3 && Math.random()<.97) forced='rpg';
  if(waveN>=2 && lootPity.minigun>=3 && Math.random()<.98) forced=(Math.random()<.55?'minigun':'chaingun');

  let pick=forced||pool[(Math.random()*pool.length)|0];
  for(let tries=0;tries<22 && !forced;tries++){
    const cand=pool[(Math.random()*pool.length)|0];
    if(lootHistory.includes(cand) && Math.random()<.9) continue;
    if(cand===P.wp && Math.random()<.88) continue;
    pick=cand; break;
  }

  lootPity.rpg = pick==='rpg' ? 0 : lootPity.rpg+1;
  lootPity.minigun = (pick==='minigun'||pick==='chaingun') ? 0 : lootPity.minigun+1;
  lootPity.flame = pick==='flame' ? 0 : lootPity.flame+1;
  lootHistory.unshift(pick); if(lootHistory.length>7) lootHistory.length=7;
  return safeWpnKey(pick);
}

function bodyRect(o){ return {x:o.x,y:o.y,w:o.w,h:o.h}; }
function moveBody(o,dt){
  o.on=false; const oldB=o.y+o.h;
  o.x+=o.vx*dt;
  for(const s of solids){ if(ov(bodyRect(o),s)){ if(o.vx>0) o.x=s.x-o.w; else if(o.vx<0) o.x=s.x+s.w; o.vx=0; } }
  o.y+=o.vy*dt;
  for(const s of solids){ if(ov(bodyRect(o),s)){ if(o.vy>0){ o.y=s.y-o.h; o.vy=0; o.on=true; } else if(o.vy<0){ o.y=s.y+s.h; o.vy=0; } } }
  if(o.vy>=0 && (o.dropT||0)<=0){ for(const p of semis){ const xok=o.x+o.w>p.x&&o.x<p.x+p.w; const nb=o.y+o.h; if(xok && oldB<=p.y && nb>=p.y){ o.y=p.y-o.h; o.vy=0; o.on=true; } } }
  o.x=clamp(o.x,58,W-58-o.w);
}

// ===== spawning drops =====
function dropSpot(x,y){
  let nx=clamp(x,70,W-70), ny=y;
  let best={d:1e9,y:ny};
  for(const s of [...solids,...semis]){
    if(nx<s.x-10||nx>s.x+s.w+10) continue;
    const d=Math.abs(s.y-ny);
    if(d<best.d){ best={d,y:s.y-6}; }
  }
  ny=clamp(best.y,86,836);
  for(let i=0;i<10;i++){
    let hit=false;
    for(const d of drops){ if(Math.hypot(d.x-nx,d.y-ny)<24){ hit=true; break; } }
    if(!hit) break;
    nx=clamp(nx+((i%2)?-1:1)*(16+i*4),70,W-70);
  }
  return [nx,ny];
}
function dropAt(x,y,t,data={}){
  const [dx,dy]=dropSpot(x,y);
  if(t==='wpn'){
    const k=safeWpnKey(data.k);
    data={...data,k};
    for(const d of drops){
      if(d.t!=='wpn') continue;
      if(Math.hypot(d.x-dx,d.y-dy)>18) continue;
      const dk=safeWpnKey(d.k);
      if(dk!==k) continue;
      d.k=dk;
      d.ammo=Math.min(999,(d.ammo||0)+(data.ammo||weaponAmmoRoll(k)));
      d.life=Math.max(d.life||0,isRareWeapon(k)?60:42);
      d.np=Math.max(d.np||0,.12);
      return;
    }
  }
  const life = t==='wpn' ? (isRareWeapon(data.k)?60:42) : (t==='flare'?28:22);
  drops.push({t,x:dx,y:dy,life,b:rand(0,6),np:data.np||0,...data});
}
function randomDrop(force=false){
  const p=pickups[(Math.random()*pickups.length)|0];
  if(!force && drops.length>16) return;
  if(force && waveN>=3 && Math.random()<.42){
    const k=(['rpg','minigun','chaingun','flame','rpg','minigun','flame','micro','seeker','gauss','tesla','arcaster'])[rint(0,11)];
    dropAt(p.x,p.y,'wpn',{k,ammo:weaponAmmoRoll(k)});
    return;
  }
  const r=Math.random();
  if(r<.14){ dropAt(p.x,p.y,'flare',{payload:FLARE_TYPES[(Math.random()*FLARE_TYPES.length)|0]}); return; }
  if(r<.20){ dropAt(p.x,p.y,'heli'); return; }
  if(r<.26){ dropAt(p.x,p.y,'turret'); return; }
  if(r<.31){ dropAt(p.x,p.y,'drone'); return; }
  if(r<.39){ dropAt(p.x,p.y,'med',{amt:22}); return; }
  if(r<.47){ dropAt(p.x,p.y,'armor',{amt:16}); return; }
  const k=pickLootWeapon();
  dropAt(p.x,p.y,'wpn',{k,ammo:weaponAmmoRoll(k)});
}
function equipFlare(payload){
  if(P.wp==='flare') { P.flarePayload=payload; return; }
  P.stash={wp:P.wp,ammo:P.ammo}; P.wp='flare'; P.ammo=1; P.flarePayload=payload; msg(`Flare equipped: ${payload.toUpperCase()}`,900);
}
function restoreStash(){ if(P.stash){ P.wp=P.stash.wp; P.ammo=P.stash.ammo; P.stash=null; P.flarePayload=null; } else { P.wp='pistol'; P.ammo=Infinity; P.flarePayload=null; } }
function pickupNear(){
  const px=P.x+P.w/2, py=P.y+P.h/2; let idx=-1, bestD=58*58;
  for(let i=0;i<drops.length;i++){ const d=drops[i]; if((d.np||0)>0) continue; const dd=d2(px,py,d.x,d.y); if(dd<bestD){ bestD=dd; idx=i; } }
  if(idx<0) return;
  const d=drops[idx];
  if(d.t==='wpn'){
    d.k=safeWpnKey(d.k); const cfg=WPN[d.k];
    if(P.wp===d.k && P.wp!=='pistol' && P.wp!=='flare' && Number.isFinite(P.ammo) && Array.isArray(cfg?.ammo)){
      const cap=Math.ceil(cfg.ammo[1]*1.55);
      if(P.ammo>=cap){ msg(`${cfg.n} ammo full`,500); d.b+=1.7; return; }
    }
  }
  S.pick();
  if(d.t==='med'){ P.hp=clamp(P.hp+d.amt,0,P.mhp); msg(`+${d.amt} HP`,700); }
  else if(d.t==='armor'){ P.arm=clamp(P.arm+d.amt,0,P.marm); msg(`+${d.amt} Armor`,700); }
  else if(d.t==='heli'){ supportHeli(12.5); msg('Gunship support ready',700); }
  else if(d.t==='turret'){ deployTurret(); msg('Auto turret deployed',700); }
  else if(d.t==='drone'){ deployDrone(); msg('Companion drone online',700); }
  else if(d.t==='flare'){ equipFlare(d.payload); }
  else if(d.t==='wpn'){
    d.k=safeWpnKey(d.k); const cfg=WPN[d.k];
    if(P.wp===d.k && P.wp!=='pistol' && P.wp!=='flare' && Number.isFinite(P.ammo)){
      const cap=Array.isArray(cfg.ammo)?Math.ceil(cfg.ammo[1]*1.55):999;
      const before=P.ammo;
      P.ammo=Math.min(cap,P.ammo+d.ammo);
      msg(`${cfg.n} ammo +${Math.max(0,Math.floor(P.ammo-before))}`,700);
      if(isRareWeapon(d.k)){ beep(980,.018,.006,'triangle',120); }
    } else {
      // old weapon now disappears on pickup swap (cleaner inventory flow)
      P.wp=d.k;
      P.ammo=Array.isArray(cfg.ammo)?Math.max(Math.ceil(cfg.ammo[0]*.3),d.ammo):d.ammo;
      P.burst=0; P.burstT=0;
      if(isRareWeapon(d.k)){ beep(540,.05,.01,'triangle',220); setTimeout(()=>beep(980,.04,.008,'triangle',140),30); }
      msg(`${cfg.n}`,700);
    }
  }
  drops.splice(idx,1);
}

  const warnW = payload==='carpet'?180 : payload==='storm'?130 : payload==='bunker'?46 : payload==='missile'?120 : payload==='napalm'?110 : payload==='precision'?48 : 56;
  zones.push({x:xp-warnW/2,y:842-6,w:warnW,h:6,t:.42,d:99,dm:0,col:FLARE_COL[payload]||'#fff',warn:true});

  const cfg=WPN[P.wp]; if(cfg&&cfg.burst){ if((Shoot||sP)&&P.burst<=0) doFire(false); if(P.burst>0&&P.burstT<=0&&P.fc<=0){ P.burst--; P.burstT=cfg.bgap; doFire(true);} } else if(Shoot) doFire(false);
  pickupNear();
}

}
function smartJump(e,dx,py){

  const blocked=Math.abs(e.vx)<14&&Math.abs(dx)>20; const above=py<e.y-18&&Math.abs(dx)<280; const panic=Math.abs(dx)<90 && py<e.y+15;

}

function enemiesUpdate(dt){

    if(waveN===2) showcase='minigun';
    if(waveN===3) showcase='rpg';

    dropAt(P.x+P.w/2+rand(-90,90),P.y-10,'wpn',{k:showcase,ammo:weaponAmmoRoll(showcase),np:.2});
    if(Math.random()<.78) dropAt(P.x+P.w/2+rand(-70,70),P.y-10,'flare',{payload:FLARE_TYPES[rint(0,FLARE_TYPES.length-1)]});
  }

  spawnT-=dt; if(spawnT<=0&&!over){ const bossAlive=enemies.some(e=>e.boss); const tgt=bossAlive?(8+Math.floor(waveN*.8)):(10+Math.floor(waveN*1.6)); if(enemies.length<tgt) spawnEnemy(); spawnT=Math.max(.12,(bossAlive?.45:.7)-waveN*.02); }

    const px=P.x+P.w/2, py=P.y+20, ex=e.x+e.w/2, ey=e.y+e.h/2, dx=px-ex, dir=sign(dx)||1;

      if(e.fc<=0 && !lineBlocked(ex,ey,px,py,12) && d2(px,py,ex,ey)<660*660) enemyShoot(e);
      if(e.touch<=0&&ov(bodyRect(e),bodyRect(P))){ e.touch=.28; damagePlayer(10); }
      continue;

    if(e.kind==='hopper'){ e.ai-=dt; e.vx*=Math.pow(.18,dt); if(e.on&&e.ai<=0){ e.vx=dir*(180+waveN*3); e.vy=-725; e.ai=rand(.55,1.0); } }

    if(e.kind==='sniper'){

function bulletsUpdate(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i], ox=b.x, oy=b.y;
    b.l-=dt; if(b.arc) b.vy+=900*dt; if(b.flame){ b.vx*=Math.pow(.08,dt); b.vy*=Math.pow(.08,dt); }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.rocket){
      tracer(ox,oy,b.x,b.y,'rgba(255,180,120,0.35)',2);
      part(b.x-(b.vx*0.02),b.y-(b.vy*0.02),1,'#ffd39b',10,45,.03,.06,1,2);
      if(Math.random()<.7) part(b.x-(b.vx*0.03),b.y-(b.vy*0.03),1,'rgba(180,190,210,.8)',4,18,.05,.09,1,2);
    } else if(b.flame){
      if(Math.random()<.8) part(b.x,b.y,1,Math.random()<.45?'#ffd28a':'#ff8f52',8,34,.03,.07,1,2);
    } else if((b.src==='minigun'||b.src==='chaingun') && Math.random()<.7){
      tracer(ox,oy,b.x,b.y,'rgba(255,234,140,0.28)',1.6);
      if(Math.random()<.25) part(b.x,b.y,1,'#fff2a4',4,12,.02,.04,1,1.4);
    } else if(b.src==='needler' && Math.random()<.6){
      tracer(ox,oy,b.x,b.y,'rgba(255,130,230,0.28)',1.3);
    } else if(b.plasma && Math.random()<.45){
      part(b.x,b.y,1,'#8efcff',6,20,.02,.05,1,1.6);
    }
    let rem=b.l<=0||b.x<0||b.x>W||b.y<0||b.y>H;
    if(!rem&&bulletWorldHit(b)){
      if(b.ric>0){
        const hitX=hitWorldPoint(b.x,oy), hitY=hitWorldPoint(ox,b.y);
        b.x=ox; b.y=oy;
        if(hitX&&!hitY) b.vx*=-1; else if(hitY&&!hitX) b.vy*=-1; else { b.vx*=-1; b.vy*=-1; }
        b.ric--; b.dm*=.92; b.pier=Math.max(b.pier||0,1);
        tracer(ox,oy,ox+b.vx*.03,oy+b.vy*.03,'#ffe89c');
        part(ox,oy,4,'#ffe89c',18,90,.02,.05,1,2);
      } else {
        if(b.rocket) explode(b.x,b.y,b.src==='micro'?86:(b.src==='seeker'?98:124),b.src==='micro'?72:(b.src==='seeker'?86:114),false,(b.src==='micro'||b.src==='seeker')&&Math.random()<.35?'napalm':'');
        else if(b.arc) explode(b.x,b.y,b.src==='launcher'?96:82,b.src==='launcher'?86:72,false,Math.random()<.45?'napalm':'');
        else if(b.plasma) explosionVisual(b.x,b.y,20,'#6cf7ff');
        else if(!b.flame) part(b.x,b.y,4,b.c,20,90,.02,.05,1,2);
        rem=!b.flame;
      }
    }
    if(!rem){
      for(const e of [...enemies]) if(ptRect(b.x,b.y,{x:e.x,y:e.y,w:e.w,h:e.h})){
        if(b.rocket){ explode(b.x,b.y,b.src==='micro'?86:(b.src==='seeker'?98:124),b.src==='micro'?72:(b.src==='seeker'?86:114),false,(b.src==='micro'||b.src==='seeker')&&Math.random()<.35?'napalm':''); rem=true; }
        else if(b.arc){ explode(b.x,b.y,b.src==='launcher'?96:82,b.src==='launcher'?86:72,false,Math.random()<.55?'napalm':''); rem=true; }
        else {
          damageEnemy(e,b.dm,b.c,b.x);
          if(b.kn){ const [nx,ny]=norm(b.vx,b.vy); e.vx+=nx*b.kn; e.vy+=ny*(b.kn*.4)-40; }
          if(b.plasma&&b.chain>0){ const n=nearestEnemy(b.x,b.y,130,en=>en!==e); if(n){ tracer(b.x,b.y,n.x+n.w/2,n.y+n.h/2,'#8effff'); damageEnemy(n,b.dm*.55,'#8effff',b.x); b.chain--; } }
          if(b.flame&&Math.random()<.18) zones.push({x:b.x-12,y:b.y-2,w:24,h:4,t:.65,d:.08,dm:4,col:'#ff9b5f'});
          if(b.pier>0){ b.pier--; b.dm*=.78; }
          else rem=true;
        }
        if(rem) break;
      }
    }
    if(!rem && b.support && Math.random()<.55) part(b.x,b.y,1,b.c,5,30,.02,.04,1,1);
    if(rem) bullets.splice(i,1);
  }
  for(let i=eb.length-1;i>=0;i--){

  else if(e.kind==='brute'){ x.fillStyle=h?'#fff':'#29402d'; x.fillRect(e.x+1,e.y+8,e.w-2,e.h-8); x.fillStyle=h?'#fff':e.col; x.fillRect(e.x+4,e.y+12,e.w-8,e.h-14); x.fillStyle='#d8ffd0'; x.fillRect(e.x+5,e.y+2,e.w-10,14); }
  else if(e.kind==='gunner'){ x.fillStyle=h?'#fff':'#4a3115'; x.fillRect(e.x+2,e.y+12,e.w-4,e.h-12); x.fillStyle=h?'#fff':e.col; x.fillRect(e.x+4,e.y+14,e.w-8,e.h-16); x.fillStyle='#2b1a0d'; x.fillRect(e.x+4,e.y,e.w-8,14); }
  else if(e.kind==='hopper'){ x.fillStyle=h?'#fff':'#5a1d46'; x.fillRect(e.x+4,e.y+10,e.w-8,e.h-14); x.fillStyle=h?'#fff':e.col; x.fillRect(e.x+6,e.y+12,e.w-12,e.h-18); }
  else { x.fillStyle=h?'#fff':'#5a2222'; x.fillRect(e.x+3,e.y+12,e.w-6,e.h-12); x.fillStyle=h?'#fff':e.col; x.fillRect(e.x+5,e.y+14,e.w-10,e.h-16); }
  if(e.kind!=='grunt'&&e.kind!=='crawler'){ const bw=e.kind==='brute'?34:26; x.fillStyle='rgba(0,0,0,.45)'; x.fillRect(e.x+e.w/2-bw/2,e.y-8,bw,3); x.fillStyle=e.el?'#ffe56b':'#ffd38f'; x.fillRect(e.x+e.w/2-bw/2,e.y-8,bw*(e.hp/e.mhp),3); }
}
function drawSupports(){
  if(heli){ x.globalAlpha=.08; x.fillStyle='#a5edff'; x.beginPath(); x.moveTo(heli.x-14,heli.y+6); x.lineTo(heli.x+14,heli.y+6); x.lineTo(heli.x+65,842); x.lineTo(heli.x-65,842); x.closePath(); x.fill(); x.globalAlpha=1; x.fillStyle='#122432'; x.fillRect(heli.x-22,heli.y-8,44,16); x.strokeStyle='#83dcff'; x.strokeRect(heli.x-22,heli.y-8,44,16); x.fillStyle='#83dcff'; x.fillRect(heli.x-28,heli.y-11,56,2); x.strokeStyle='#d7fbff'; x.beginPath(); x.moveTo(heli.x-Math.sin(heli.spin)*18,heli.y-10); x.lineTo(heli.x+Math.sin(heli.spin)*18,heli.y-12); x.stroke(); x.fillStyle='#83dcff'; x.fillRect(heli.x+20,heli.y-2,10,2); x.fillRect(heli.x-8,heli.y+8,16,2); }
  for(const t of turrets){ x.fillStyle='#243424'; x.fillRect(t.x-10,t.y-12,20,12); x.strokeStyle='#9dff8b'; x.strokeRect(t.x-10,t.y-12,20,12); const e=nearestEnemy(t.x,t.y,700); let ang=0; if(e) ang=Math.atan2((e.y+e.h/2)-(t.y-8),(e.x+e.w/2)-t.x); x.save(); x.translate(t.x,t.y-8); x.rotate(ang); x.fillStyle='#9dff8b'; x.fillRect(-2,-2,14,4); x.restore(); }
  for(const d of drones){ x.globalAlpha=.18; x.fillStyle='#8effff'; x.beginPath(); x.arc(d.x,d.y,14,0,Math.PI*2); x.fill(); x.globalAlpha=1; x.fillStyle='#142a2d'; x.fillRect(d.x-10,d.y-6,20,12); x.strokeStyle='#8effff'; x.strokeRect(d.x-10,d.y-6,20,12); x.fillStyle='#8effff'; x.fillRect(d.x-14,d.y-8,28,2); }
}
function drawProj(){
  for(const z of zones){ if(z.warn){ x.globalAlpha=.25+.25*Math.sin(performance.now()*.03); x.fillStyle=z.col; x.fillRect(z.x,z.y,z.w,z.h); } else { x.globalAlpha=.22; x.fillStyle=z.col; x.fillRect(z.x,z.y,z.w,z.h); } }
  x.globalAlpha=1;
  for(const f of flareObjs){
    const cc=FLARE_COL[f.payload]||'#ff5f5f';
    x.fillStyle=cc; x.beginPath(); x.arc(f.x,f.y,4,0,Math.PI*2); x.fill();
    x.globalAlpha=.25; x.fillStyle=cc; x.beginPath(); x.arc(f.x,f.y,9,0,Math.PI*2); x.fill(); x.globalAlpha=1;
    if(f.s==='armed'){ x.globalAlpha=.45+Math.sin(performance.now()*.02)*.2; x.strokeStyle=cc; x.beginPath(); x.arc(f.x,838,10,0,Math.PI*2); x.stroke(); x.beginPath(); x.arc(f.x,838,18,0,Math.PI*2); x.stroke(); x.globalAlpha=1; }
  }
  for(const a of air){
    if(a.delay>0){
      if(['rail','precision','missile','napalm','cluster','bunker'].includes(a.t)){ x.globalAlpha=.35; x.strokeStyle=AIR_COL[a.t]||'#fff'; x.beginPath(); x.arc(a.x,838,a.t==='precision'?14:(a.t==='cluster'?12:(a.t==='bunker'?16:10)),0,Math.PI*2); x.stroke(); x.globalAlpha=1; }
      if(a.t==='mark'){ x.globalAlpha=.35; x.strokeStyle='#7fd9ff'; x.beginPath(); x.arc(a.x,838,9,0,Math.PI*2); x.stroke(); x.globalAlpha=1; }
      continue;
    }
    if(a.t==='rail'){ x.globalAlpha=.35; x.fillStyle=AIR_COL.rail; x.fillRect(a.x-3,0,6,842); x.globalAlpha=1; continue; }
    if(a.t==='supply'){
      if(a.y<230){ x.strokeStyle='rgba(220,255,230,.85)'; x.beginPath(); x.arc(a.x,a.y-16,10,0,Math.PI*2); x.stroke(); x.beginPath(); x.moveTo(a.x-8,a.y-10); x.lineTo(a.x-4,a.y-2); x.moveTo(a.x+8,a.y-10); x.lineTo(a.x+4,a.y-2); x.moveTo(a.x,a.y-6); x.lineTo(a.x,a.y-1); x.stroke(); }
      x.fillStyle='#7dff98'; x.fillRect(a.x-6,a.y-7,12,14); x.strokeStyle='#d8ffe3'; x.strokeRect(a.x-6,a.y-7,12,14);
    }
    else if(a.t==='mark'){ x.globalAlpha=.35; x.strokeStyle=AIR_COL.mark; x.beginPath(); x.arc(a.x,838,9,0,Math.PI*2); x.stroke(); x.globalAlpha=1; }
    else {
      const cc=AIR_COL[a.t]||AIR_COL.bomb;
      x.globalAlpha=.35; x.strokeStyle=cc; x.beginPath(); x.moveTo(a.x,a.y-22); x.lineTo(a.x,a.y+10); x.stroke(); x.globalAlpha=1;
      if(a.t==='precision'){
        x.fillStyle=cc; x.beginPath(); x.moveTo(a.x,a.y-10); x.lineTo(a.x-4,a.y+4); x.lineTo(a.x+4,a.y+4); x.closePath(); x.fill(); x.fillStyle='#eaffff'; x.fillRect(a.x-1,a.y-13,2,4);
      } else if(a.t==='missile'){
        x.save(); x.translate(a.x,a.y); x.fillStyle=cc; x.fillRect(-3,-8,6,16); x.fillStyle='#ffd5d5'; x.fillRect(-1,-11,2,4); x.fillRect(-6,2,3,3); x.fillRect(3,2,3,3); x.restore();
      } else if(a.t==='napalm'){
        x.save(); x.translate(a.x,a.y); x.fillStyle=cc; x.fillRect(-4,-7,8,14); x.fillStyle='#ffc48a'; x.fillRect(-2,-10,4,3); x.fillRect(-6,1,2,4); x.fillRect(4,1,2,4); x.restore();
      } else if(a.t==='cluster'){
        x.save(); x.translate(a.x,a.y); x.fillStyle=cc; x.fillRect(-4,-8,8,16); x.fillRect(-8,-3,4,6); x.fillRect(4,-3,4,6); x.fillStyle='#ffe0ba'; x.fillRect(-1,-10,2,3); x.restore();
      } else {
        x.save(); x.translate(a.x,a.y); x.fillStyle=cc; x.fillRect(-4,-8,8,16); x.fillStyle='#ffd8b3'; x.fillRect(-1,-11,2,4); x.restore();
      }
    }
  }
  for(const g of gren){ x.fillStyle='#ffd27a'; x.beginPath(); x.arc(g.x,g.y,4.5,0,Math.PI*2); x.fill(); }
  for(const t0 of tr){ x.globalAlpha=(1-t0.t/t0.l)*.85; x.strokeStyle=t0.c; x.lineWidth=t0.w||2; x.lineCap='round'; x.beginPath(); x.moveTo(t0.x1,t0.y1); x.lineTo(t0.x2,t0.y2); x.stroke(); } x.lineCap='butt';
  x.globalAlpha=1;
  for(const b of bullets){
    if(b.rocket){ const ang=Math.atan2(b.vy,b.vx); const rs=b.src==='micro'?6:(b.src==='seeker'?7:10); const bl=b.src==='micro'?12:(b.src==='seeker'?14:16); x.save(); x.translate(b.x,b.y); x.rotate(ang); x.globalAlpha=.18; x.fillStyle=b.c; x.beginPath(); x.arc(0,0,rs,0,Math.PI*2); x.fill(); x.globalAlpha=1; x.fillStyle=b.c; x.fillRect(-bl*0.55,-2,bl,4); x.beginPath(); x.moveTo(bl*0.45,0); x.lineTo(bl*0.8,-3); x.lineTo(bl*0.8,3); x.closePath(); x.fill(); x.fillStyle='#2a2f37'; x.fillRect(-1,-1,3,2); x.fillStyle='#ffe0a3'; x.fillRect(-bl*0.9,-1,4,2); x.fillRect(-bl*1.05,-2,2,4); if(b.src!=='micro'){ x.fillRect(-bl*0.25,-4,2,2); x.fillRect(-bl*0.25,2,2,2);} x.restore(); }
    else if(b.plasma){ x.globalAlpha=.25; x.fillStyle=b.c; x.beginPath(); x.arc(b.x,b.y,7,0,Math.PI*2); x.fill(); x.globalAlpha=1; x.fillStyle=b.c; x.fillRect(b.x-3,b.y-3,6,6); }
    else if(b.flame){ x.globalAlpha=.25; x.fillStyle='#ffd28a'; x.beginPath(); x.arc(b.x,b.y,8,0,Math.PI*2); x.fill(); x.globalAlpha=.55; x.fillStyle=b.c; x.beginPath(); x.arc(b.x,b.y,5,0,Math.PI*2); x.fill(); x.globalAlpha=1; }
    else if(b.disc){ x.save(); x.translate(b.x,b.y); x.rotate(performance.now()*.02); x.fillStyle=b.c; x.beginPath(); x.arc(0,0,b.r+1,0,Math.PI*2); x.fill(); x.strokeStyle='#fff4ba'; x.lineWidth=2; x.beginPath(); x.moveTo(-b.r-1,0); x.lineTo(b.r+1,0); x.moveTo(0,-b.r-1); x.lineTo(0,b.r+1); x.stroke(); x.restore(); }
    else if(b.spark){ x.fillStyle=b.c; x.fillRect(b.x-3,b.y-1,6,2); x.fillStyle='#fff'; x.fillRect(b.x-1,b.y-1,2,2); }
    else if(b.ric){ x.fillStyle=b.c; x.beginPath(); x.arc(b.x,b.y,3.5,0,Math.PI*2); x.fill(); x.strokeStyle='#fff2b0'; x.strokeRect(b.x-4,b.y-4,8,8); }
    else { x.fillStyle=b.c; x.fillRect(b.x-b.r,b.y-b.r,b.r*2,b.r*2); }
  }
  for(const b of eb){ if(b.rocket){ const ang=Math.atan2(b.vy,b.vx); x.save(); x.translate(b.x,b.y); x.rotate(ang); x.fillStyle=b.c; x.fillRect(-6,-2,12,4); x.beginPath(); x.moveTo(6,0); x.lineTo(10,-3); x.lineTo(10,3); x.closePath(); x.fill(); x.fillStyle='#ffd3b0'; x.fillRect(-10,-1,4,2); x.restore(); } else { x.fillStyle=b.c; x.fillRect(b.x-b.r,b.y-b.r,b.r*2,b.r*2);} }
  for(const s0 of shells){ x.save(); x.translate(s0.x,s0.y); x.rotate(s0.r); x.globalAlpha=1-s0.t/s0.l; x.fillStyle='#d9b66f'; x.fillRect(-2,-1,4,2); x.restore(); }
  x.globalAlpha=1;
  for(const f0 of flashes){ x.save(); x.translate(f0.x,f0.y); x.rotate(f0.a); x.globalAlpha=(1-f0.t/f0.l)*.8; x.fillStyle=f0.c; x.beginPath(); x.moveTo(0,0); x.lineTo(f0.s,-f0.s*.35); x.lineTo(f0.s*.55,0); x.lineTo(f0.s,f0.s*.35); x.closePath(); x.fill(); x.restore(); }
  x.globalAlpha=1;
}
function drawFx(){ for(const e of exps){ const k=e.t/e.l, r=e.r*(.25+k*.9); x.globalAlpha=Math.max(0,.35*(1-k)); x.strokeStyle='#ffd18f'; x.lineWidth=3; x.beginPath(); x.arc(e.x,e.y,r,0,Math.PI*2); x.stroke(); x.globalAlpha=Math.max(0,.25*(1-k)); x.fillStyle=e.c; x.beginPath(); x.arc(e.x,e.y,e.r*(.18+.45*(1-k)),0,Math.PI*2); x.fill(); } for(const p of parts){ x.globalAlpha=Math.max(0,1-p.t/p.l); x.fillStyle=p.c; x.fillRect(p.x,p.y,p.s,p.s); } x.globalAlpha=1; }
function overlay(){
  const vg=x.createRadialGradient(800,450,240,800,450,900); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.35)'); x.fillStyle=vg; x.fillRect(0,0,W,H);
  if(mouse.active){ const xx=mouse.wx,yy=mouse.wy; x.strokeStyle='rgba(255,255,255,.65)'; x.lineWidth=1; x.beginPath(); x.moveTo(xx-7,yy);x.lineTo(xx-2,yy); x.moveTo(xx+2,yy);x.lineTo(xx+7,yy); x.moveTo(xx,yy-7);x.lineTo(xx,yy-2); x.moveTo(xx,yy+2);x.lineTo(xx,yy+7); x.stroke(); }
  if(paused&&!over){ x.fillStyle='rgba(0,0,0,.5)'; x.fillRect(0,0,W,H); x.fillStyle='#fff'; x.textAlign='center'; x.font='bold 52px system-ui'; x.fillText('PAUSED',W/2,H/2); }
  if(over){ x.fillStyle='rgba(0,0,0,.56)'; x.fillRect(0,0,W,H); x.fillStyle='#fff'; x.textAlign='center'; x.font='bold 50px system-ui'; x.fillText('GAME OVER',W/2,H/2-12); x.fillStyle='#c9d5ea'; x.font='500 18px system-ui'; x.fillText(`Score ${scoreN} • Best ${best}`,W/2,H/2+16); x.fillText('Press R or Restart',W/2,H/2+40); }
}
function draw(dt){ begin(); bg(); const [sx,sy]=shakeStep(dt); x.save(); x.translate(sx,sy); mapDraw(); drawDrops(); drawSupports(); for(const e of enemies) drawEnemy(e); drawPlayer(); drawProj(); drawFx(); x.restore(); overlay(); }

// ===== hud / loop / reset =====
function cd(v){ return v<=0?'Ready':`${v.toFixed(1)}s`; }
function hud(){
  UI.hp.textContent=`HP: ${Math.floor(P.hp)}`; UI.armor.textContent=`Armor: ${Math.floor(P.arm)}`;
  const w=WPN[P.wp]||WPN.pistol; let extra=''; if(P.wp==='flare'&&P.flarePayload) extra=` • ${P.flarePayload.toUpperCase()}`; UI.wpn.textContent=`${w.n}${extra} (${P.ammo===Infinity?'∞':Math.max(0,Math.floor(P.ammo))})`;
  UI.wave.textContent=`Wave: ${waveN}`; UI.score.textContent=`Score: ${scoreN} • Best: ${best}`; UI.combo.textContent=`Combo: x${(1+Math.min(2,comboN*.05)).toFixed(2)}`;
  UI.dash.textContent=`Dash: ${cd(P.dc)}`; UI.nade.textContent=`Grenade: ${cd(P.gc)}`; UI.shock.textContent=`Shock: ${cd(P.qc)}`; UI.boost.textContent=P.ct>0?`Boost: ${P.ct.toFixed(1)}s`:`Boost: ${cd(P.cc)}`;
  UI.sup.textContent=`Support: Heli ${heli?heli.t.toFixed(1)+'s':'-'} • Turrets ${turrets.length} • Drones ${drones.length}`; UI.snd.textContent=`Sound: ${soundOn?'ON':'OFF'}`; const sm=document.getElementById('tbSoundM'); if(sm) sm.textContent=soundOn?'Sound':'Muted'; const pm=document.getElementById('tbPauseM'); if(pm) pm.textContent=paused?'Resume':'Pause';
  const b=enemies.find(e=>e.boss); if(b){ UI.boss.style.display='block'; UI.bossTxt.textContent=`${b.name} • Phase ${b.phase} • ${Math.max(0,Math.floor(b.hp))} HP`; UI.bossFill.style.width=`${clamp(100*b.hp/b.mhp,0,100)}%`; } else UI.boss.style.display='none';
}
function togglePause(){ if(over) return; paused=!paused; pauseBtn.textContent=paused?'Resume':'Pause'; }
function reset(){
  Object.assign(P,{x:220,y:760,w:24,h:44,vx:0,vy:0,on:false,coy:0,jbuf:0,dropT:0,padT:0,hp:180,mhp:180,arm:20,marm:80,alive:true,i:0,fc:0,dc:0,dt:0,gc:0,qc:0,cc:0,ct:0,jumps:2,f:1,wp:'pistol',ammo:Infinity,prevJump:0,prevDash:0,prevG:0,prevQ:0,prevC:0,prevShoot:0,walk:0,kick:0,tilt:0,burst:0,burstT:0,stash:null,flarePayload:null});
  bullets=[]; eb=[]; gren=[]; drops=[]; enemies=[]; air=[]; flareObjs=[]; heli=null; turrets=[]; drones=[]; zones=[]; parts=[]; tr=[]; flashes=[]; exps=[]; shells=[]; decals=[];
  waveN=1; waveT=0; spawnT=0; dropT=2.2; scoreN=0; comboN=0; comboT=0; bossWaveDone=0; shakeT=0; shakeP=0; lootHistory=[]; lootPity={rpg:0,minigun:0,flame:0}; paused=false; over=false; clearIn(); pauseBtn.textContent='Pause';
  for(let i=0;i<5;i++) spawnEnemy();
  randomDrop(true); randomDrop(true); randomDrop(true);
  dropAt(P.x+130,P.y-10,'wpn',{k:'flame',ammo:weaponAmmoRoll('flame'),np:.2});
  dropAt(P.x+195,P.y-10,'wpn',{k:'rpg',ammo:weaponAmmoRoll('rpg'),np:.2});
  const showcaseHeavy=Math.random()<.6?'minigun':'chaingun';
  dropAt(P.x+260,P.y-10,'wpn',{k:showcaseHeavy,ammo:weaponAmmoRoll(showcaseHeavy),np:.2});
  if(Math.random()<.75){ const showcaseAlt=Math.random()<.5?'arcaster':'seeker'; dropAt(P.x+325,P.y-10,'wpn',{k:showcaseAlt,ammo:weaponAmmoRoll(showcaseAlt),np:.2}); }
  dropAt(P.x+60,P.y-8,'flare',{payload:'precision'});
  if(Math.random()<.6) dropAt(P.x+110,P.y-8,'flare',{payload:'gunship'});
  updateCamera(1);
  msg('New run',700);
}
function loop(t){ const dt=Math.min(.033,(t-last)/1000||0); last=t; if(keys.has('KeyR')&&over) reset(); update(dt); draw(dt); requestAnimationFrame(loop); }
rstBtn.addEventListener('click',()=>{au(); reset();}); pauseBtn.addEventListener('click',()=>{au(); togglePause();});
resize(); reset(); requestAnimationFrame(loop);
})();
</script>
